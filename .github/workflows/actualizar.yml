name: Recoleccion Diario de Cotizaciones

on:
  schedule:
    - cron: '0 21 * * 1-5'  # De lunes a viernes a las 21:00 UTC (18:00 hora de Argentina)
  workflow_dispatch:        # Permite ejecutarlo manualmente con el botón

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install requests

      - name: Ejecutar script recolector
        run: |
          echo "Buscando archivo de script Python..."
          if [ -f "coleccionista.py" ]; then
            python coleccionista.py
          elif [ -f "recolector.py" ]; then
            python recolector.py
          elif [ -f "collector.py" ]; then
            python collector.py
          else
            echo "Archivos en la carpeta:"
            ls -la
            SCRIPT=$(find . -maxdepth 1 -name "*.py" | head -n 1)
            if [ -n "$SCRIPT" ]; then
              echo "Ejecutando: $SCRIPT"
              python "$SCRIPT"
            else
              echo "No se encontró ningún archivo .py en la raíz"
              exit 1
            fi
          fi

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add -f precios.json historial.json
          git commit -m "Actualizar cotizaciones [skip ci]" || echo "Sin cambios nuevos para commitear"
          git push origin HEAD:${{ github.ref_name }}
